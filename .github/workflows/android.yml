name: Build Android Native App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Ensure WWW Directory Exists
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; fi
          if [ -f index ]; then cp index www/index.html; fi

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Native Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --rerun-tasks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masar-Native-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
